<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimal Digital Watch — Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 24% 10%, #586576 0, #2a323e 26%, transparent 55%), radial-gradient(circle at 85% 82%, #322228 0, #151920 31%, transparent 58%), #090c11; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; color: white; user-select: none; -webkit-font-smoothing: antialiased; }
      .watch-card { position: relative; display: flex; width: 430px; height: 182px; padding: 8px; overflow: hidden; border: 1px solid #ffffff1a; border-radius: 40px; background: linear-gradient(135deg, #1a1b1ee0, #07080aeb 62%); -webkit-backdrop-filter: blur(30px) saturate(135%); backdrop-filter: blur(30px) saturate(135%); box-shadow: 0 24px 56px #00000061, 0 5px 16px #00000033, inset 0 1px 0 #ffffff17; cursor: grab; touch-action: none; }
      .watch-card:active { cursor: grabbing; }
      .watch-card::before { content: ""; position: absolute; top: 0; left: 52px; width: 128px; height: 1px; background: linear-gradient(90deg, transparent, #ffffff38, transparent); }
      .left-pane { display: flex; flex: 1; flex-direction: column; justify-content: center; min-width: 0; padding: 3px 18px 2px 25px; }
      .date { margin-bottom: 10px; color: #fff; font-size: 11px; font-weight: 520; letter-spacing: .1px; }
      .time { color: #fff; font-size: 64px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -3.5px; line-height: .92; }
      .colon { color: #fff; }
      .location { display: flex; align-items: center; gap: 7px; margin-top: 16px; color: #fff; font-size: 9px; font-weight: 650; letter-spacing: .35px; }
      .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #a8a8a8; box-shadow: 0 0 8px #a8a8a899; }
      .right-pane { position: relative; display: flex; align-items: center; justify-content: center; width: 150px; margin: 0; padding: 0; overflow: hidden; border: 1px solid #ffffff14; border-radius: 32px; outline: none; background: radial-gradient(circle at 28% 8%, #ffffff1c, transparent 43%), linear-gradient(145deg, color-mix(in srgb, var(--pane) 86%, transparent), color-mix(in srgb, var(--pane) 38%, black)); color: #fff; font-family: inherit; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff14; transition: background .2s ease, transform .2s ease; }
      .right-pane:hover { background: radial-gradient(circle at 28% 8%, #ffffff21, transparent 43%), linear-gradient(145deg, color-mix(in srgb, var(--pane) 92%, white), color-mix(in srgb, var(--pane) 42%, black)); }
      .right-pane:active { transform: scale(.985); }
      .progress-svg { width: 112px; height: 112px; transform: rotate(-90deg); }
      .progress-bg { fill: none; stroke: #ffffff18; stroke-width: 6; }
      .progress-bar { fill: none; stroke: #a8a8a8; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 282.743; filter: drop-shadow(0 0 4px #a8a8a838); }
      .progress-content { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
      .progress-value { color: #fff; font-size: 28px; font-weight: 400; line-height: 1; letter-spacing: -1px; }
      .progress-unit { margin-top: 5px; color: #fff; font-size: 7px; font-weight: 650; letter-spacing: .85px; }
      .color-icon { display: none; width: 26px; height: 26px; fill: #fff; opacity: .95; filter: drop-shadow(0 1px 2px #00000059); }
    </style>
  </head>
  <body>
    <div class="watch-card">
      <div class="left-pane">
        <div id="date" class="date"></div>
        <div class="time"><span id="hours"></span><span class="colon">:</span><span id="minutes"></span></div>
        <div class="location"><span class="live-dot"></span><span id="location"></span></div>
      </div>
      <button id="progress-button" class="right-pane" type="button" aria-label="Change progress mode">
        <svg class="progress-svg" viewBox="0 0 112 112"><circle class="progress-bg" cx="56" cy="56" r="45" /><circle id="progress" class="progress-bar" cx="56" cy="56" r="45" /></svg>
        <span class="progress-content"><span id="progress-value" class="progress-value"></span><svg id="color-icon" class="color-icon" viewBox="0 0 512 512" aria-hidden="true"><path d="M50.75 333.25c-12 12-18.75 28.28-18.75 45.26V424L0 480l32 32 56-32h45.49c16.97 0 33.25-6.74 45.25-18.74l126.64-126.62c-14.58-6.12-28.8-14.03-41.1-26.35L50.75 333.25zM483.88 28.12c-37.47-37.5-98.28-37.5-135.75 0L238.75 137.5c-6.25 6.25-6.25 16.38 0 22.63l9.37 9.37-34.25 34.25c-9.37 9.37-9.37 24.56 0 33.94l22.62 22.62c9.37 9.37 24.56 9.37 33.94 0l34.25-34.25 9.37 9.37c6.25 6.25 16.38 6.25 22.63 0L411.88 164c37.5-37.47 37.5-98.28 0-135.75z" /></svg><span id="progress-unit" class="progress-unit"></span></span>
      </button>
    </div>
    <script>
      const pad = (value) => String(value).padStart(2, "0");
      const modes = ["second", "day", "year", "color"];
      const circumference = 2 * Math.PI * 45;
      const DEFAULT_PANE_COLOR = "#26536a";
      let modeIndex = 0;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "LOCAL";
      const card = document.querySelector(".watch-card");
      let suppressClick = false;
      let offsetX = Number(localStorage.getItem("watch.offsetX") || 0);
      let offsetY = Number(localStorage.getItem("watch.offsetY") || 0);
      let paneColor = localStorage.getItem("watch.paneColor");
      if (!/^#[0-9a-f]{6}$/i.test(paneColor || "")) paneColor = DEFAULT_PANE_COLOR;
      let drag = null;
      card.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      card.style.setProperty("--pane", paneColor);
      card.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();
        drag = { sx: e.clientX, sy: e.clientY, ox: offsetX, oy: offsetY, moved: false };
      });
      window.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.sx;
        const dy = e.clientY - drag.sy;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        offsetX = Math.round((drag.ox + dx) / 8) * 8;
        offsetY = Math.round((drag.oy + dy) / 8) * 8;
        card.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      });
      window.addEventListener("pointerup", () => {
        if (!drag) return;
        if (drag.moved) {
          suppressClick = true;
          localStorage.setItem("watch.offsetX", String(offsetX));
          localStorage.setItem("watch.offsetY", String(offsetY));
        }
        drag = null;
        setTimeout(() => { suppressClick = false; }, 0);
      });
      document.querySelector("#location").textContent = timeZone.split("/").pop().replaceAll("_", " ");
      const openColorPanel = () => {
        const input = document.createElement("input");
        input.type = "color";
        input.value = paneColor;
        input.style.cssText = "position:fixed;top:0;left:-10000px;opacity:0;pointer-events:none;";
        document.body.appendChild(input);
        let done = false;
        const commit = () => {
          if (done) return;
          done = true;
          const next = input.value.toLowerCase();
          if (next !== paneColor) {
            paneColor = next;
            card.style.setProperty("--pane", paneColor);
            localStorage.setItem("watch.paneColor", paneColor);
          }
          input.remove();
        };
        input.addEventListener("change", commit);
        input.addEventListener("cancel", commit);
        input.addEventListener("blur", () => {
          setTimeout(() => {
            if (input.parentNode) input.remove();
          }, 300);
        });
        input.click();
      };
      document.querySelector("#progress-button").addEventListener("click", () => {
        if (suppressClick) { suppressClick = false; return; }
        modeIndex = (modeIndex + 1) % modes.length;
      });
      document.querySelector("#progress-button").addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (suppressClick) { suppressClick = false; return; }
        openColorPanel();
      });
      const update = () => {
        const now = new Date();
        const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
        const minutes = now.getMinutes() + seconds / 60;
        const hours = now.getHours() + minutes / 60;
        const mode = modes[modeIndex];
        let progress;
        let value;
        let unit;
        if (mode === "day") {
          progress = hours / 24;
          value = `${Math.floor(progress * 100)}%`;
          unit = "DAY";
        } else if (mode === "year") {
          const startOfYear = new Date(now.getFullYear(), 0, 0);
          const dayOfYear = Math.floor((now - startOfYear) / 86400000);
          const year = now.getFullYear();
          const daysInYear = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
          progress = dayOfYear / daysInYear;
          value = String(dayOfYear);
          unit = "DAY";
        } else if (mode === "color") {
          progress = 1;
          value = paneColor.replace("#", "").toUpperCase();
          unit = "COLOR";
        } else {
          progress = seconds / 60;
          value = pad(now.getSeconds());
          unit = "SEC";
        }
        document.querySelector("#hours").textContent = pad(now.getHours());
        document.querySelector("#minutes").textContent = pad(now.getMinutes());
        document.querySelector("#date").textContent = `${now.toLocaleDateString(undefined, { weekday: "long" })}, ${now.toLocaleDateString(undefined, { month: "long" })} ${now.getDate()}`;
        const progressRing = document.querySelector("#progress");
        progressRing.style.strokeDashoffset = circumference * (1 - progress);
        progressRing.style.stroke = mode === "color" ? paneColor : "";
        document.querySelector("#progress-value").textContent = value;
        document.querySelector("#progress-value").style.display = mode === "color" ? "none" : "";
        document.querySelector("#color-icon").style.display = mode === "color" ? "" : "none";
        document.querySelector("#progress-unit").textContent = unit;
        requestAnimationFrame(update);
      };
      update();
    </script>
  </body>
</html>
